# Local development database only. Credentials are placeholders, never use them outside your machine.
services:
  postgres:
    image: postgres:16
    container_name: shelfy-postgres
    environment:
      POSTGRES_DB: shelfy
      POSTGRES_USER: shelfy
      POSTGRES_PASSWORD: shelfy_local_dev
    ports:
      - "5432:5432"
    volumes:
      - shelfy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfy -d shelfy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shelfy-pgdata:
