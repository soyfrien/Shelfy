# Shelfy API reverse proxy -> http://127.0.0.1:5080 (separate file; does not touch other sites)
limit_req_zone $binary_remote_addr zone=shelfy_api:10m rate=10r/s;
limit_req_status 429;

upstream shelfy_backend {
    server 127.0.0.1:5080;
    keepalive 8;
}

server {
    listen 10.0.0.4:80;
    listen 10.0.0.6:80;
    listen [::]:80;
    server_name shelfy.ppdac.ltd;

    client_max_body_size 25m;

    # Bodies over the limit get the app's JSON error shape instead of nginx's HTML page (the UI shows its own message on 413 anyway).
    error_page 413 @shelfy_too_large;
    location @shelfy_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":"That photo is too large (max 20 MB). Try a smaller photo or a lower camera resolution."}';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        limit_req zone=shelfy_api burst=40 nodelay;
        proxy_pass http://shelfy_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
