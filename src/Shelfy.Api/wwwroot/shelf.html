<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a4b2a">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Shelfy">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
{{IMAGE_TAG}}
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a href="/"><h1>📚 Shelfy</h1></a><span class="tag">A shared bookshelf</span></header>
  <p class="notice" id="loading">Loading shelf…</p>
  <p class="empty hidden" id="empty">This shelf has no books yet.</p>
  <p class="card error hidden" id="err">Couldn't load this shelf. Please try again.</p>
  <ul class="grid" id="books"></ul>
  <p style="margin-top:24px"><a class="btn secondary" href="/">Make your own shelf from a photo</a></p>
  <footer>Shelfy is an early test.</footer>
</div>
<script src="/shared.js"></script>
<script src="/shelf.js"></script>
</body>
</html>
